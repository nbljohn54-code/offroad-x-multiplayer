<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OFFROAD X Multiplayer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:white;font-family:Arial,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;background:#172019}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#07101acc,#07101a88);z-index:20}
.card{width:min(440px,94vw);background:#111923ee;border:1px solid #ffffff20;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0009}
h1{margin:0 0 6px;font-size:32px}p{color:#aeb9c7}.row{display:flex;gap:10px}.row>*{flex:1}
input,button{width:100%;padding:15px;border-radius:13px;border:1px solid #ffffff20;background:#202b38;color:white;font-size:16px;margin:6px 0}
button{font-weight:800;background:#e85d2a;border:0}.secondary{background:#344355}.danger{background:#8d3030}
.hidden{display:none!important}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#101722d9;border:1px solid #ffffff20;padding:8px 12px;border-radius:14px;font-weight:700}
#rooms{max-height:210px;overflow:auto;margin-top:8px}.room{display:flex;align-items:center;gap:8px;background:#1a2531;padding:10px;border-radius:12px;margin:6px 0}.room span{flex:1}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
.ctrl{position:absolute;pointer-events:auto;border:2px solid #ffffff35;box-shadow:0 6px 18px #0008;color:white;font-weight:900}
#left{left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:#253345dd}
#left .lbtn{position:absolute;width:62px;height:62px;border-radius:50%;background:#52657bdd;font-size:28px}
#turnL{left:8px;top:44px}#turnR{right:8px;top:44px}
#right{right:max(18px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:185px;height:220px}
.pedal{position:absolute;width:82px;height:105px;border-radius:18px;background:#247c4ddd;font-size:20px}
#go{right:0;bottom:0}#back{left:0;bottom:0;background:#b34a43dd}
.small{width:70px;height:60px;border-radius:16px;background:#b58a25dd;font-size:14px}
#boost{right:2px;top:0;background:#b34b9ddd}#hand{left:0;top:0;background:#526070dd}
#repair{right:50%;transform:translateX(50%);bottom:250px;width:92px;height:58px;border-radius:18px;background:#2586aadd}
#speed{font-size:20px}.bar{width:120px;height:8px;background:#333;border-radius:9px;overflow:hidden}.fill{height:100%;width:100%;background:#e85d2a}
#lobbyList{max-height:190px;overflow:auto}.player{padding:9px;background:#1b2632;border-radius:10px;margin:5px 0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" class="screen"><div class="card">
<h1>OFFROAD X</h1><p>3D Internet Multiplayer</p>
<div class="row"><button id="createBtn">CREATE SERVER</button><button id="joinBtn" class="secondary">JOIN SERVER</button></div>
</div></div>
<div id="create" class="screen hidden"><div class="card">
<h2>Create Server</h2><input id="cName" placeholder="Your name"><input id="cRoom" placeholder="Room name"><input id="cCode" placeholder="Room code (optional)"><input id="cPass" placeholder="Password (optional)" type="password">
<div class="row"><button id="doCreate">CREATE</button><button class="secondary back">BACK</button></div>
</div></div>
<div id="join" class="screen hidden"><div class="card">
<h2>Join Server</h2><input id="jName" placeholder="Your name"><input id="jCode" placeholder="Room code"><input id="jPass" placeholder="Password (if required)" type="password">
<div class="row"><button id="doJoin">JOIN</button><button id="refresh" class="secondary">REFRESH</button></div>
<div id="rooms"></div><button class="secondary back">BACK</button>
</div></div>
<div id="lobby" class="screen hidden"><div class="card">
<h2 id="roomTitle">Lobby</h2><p id="roomCode"></p><div id="lobbyList"></div>
<div class="row"><button id="ready">READY</button><button id="start" class="secondary">START RACE</button></div><button id="leave" class="danger">LEAVE ROOM</button>
</div></div>
<div id="hud"><div id="top"><div class="pill" id="speed">0 km/h</div><div class="pill" id="count">Players: 1</div><div><div class="pill">BOOST</div><div class="bar"><div id="boostbar" class="fill"></div></div></div></div></div>
<div id="controls" class="hidden">
<div id="left" class="ctrl"><button id="turnL" class="lbtn">◀</button><button id="turnR" class="lbtn">▶</button></div>
<div id="right" class="ctrl"><button id="hand" class="ctrl small">HAND<br>BRAKE</button><button id="boost" class="ctrl small">BOOST</button><button id="back" class="ctrl pedal">BACK<br>↶</button><button id="go" class="ctrl pedal">GO<br>▲</button></div>
<button id="repair" class="ctrl">🔧 REPAIR</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io({autoConnect:true}); let room=null,started=false,me=null,remote={};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden")); if(id)$ (id).classList.remove("hidden")}
function $(id){return document.getElementById(id)}
$("createBtn").onclick=()=>show("create");$("joinBtn").onclick=()=>{show("join");socket.emit("getRooms")};
document.querySelectorAll(".back").forEach(b=>b.onclick=()=>show("menu"));
$("refresh").onclick=()=>socket.emit("getRooms");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function roomHTML(list){$("rooms").innerHTML=list.length?list.map(r=>`<div class="room"><span><b>${esc(r.name)}</b><br><small>${r.code} · ${r.count}/12 ${r.locked?"🔒":""}</small></span><button onclick="quickJoin('${r.code}')">JOIN</button></div>`).join(""):"<p>No servers yet.</p>"}
window.quickJoin=code=>{$("jCode").value=code;$("doJoin").click()};
$("doCreate").onclick=()=>socket.emit("createRoom",{name:$("cName").value,roomName:$("cRoom").value,code:$("cCode").value,password:$("cPass").value},res=>res.ok?null:alert(res.error));
$("doJoin").onclick=()=>socket.emit("joinRoom",{name:$("jName").value,code:$("jCode").value,password:$("jPass").value},res=>{if(!res.ok)alert(res.error)});
socket.on("rooms",roomHTML);
socket.on("lobby",r=>{room=r;show("lobby");$("roomTitle").textContent=r.name;$("roomCode").textContent="Room code: "+r.code;
$("count").textContent="Players: "+r.players.length;$("lobbyList").innerHTML=r.players.map(p=>`<div class="player">${p.host?"👑 ":""}${esc(p.name)} ${p.ready?"✅":"⏳"}</div>`).join("");
$("start").style.display=r.hostId===socket.id?"block":"none";});
$("ready").onclick=()=>socket.emit("toggleReady");$("start").onclick=()=>socket.emit("startRace");
$("leave").onclick=()=>{socket.emit("leaveRoom");room=null;show("menu");$("controls").classList.add("hidden")};
socket.on("notice",alert);socket.on("raceStarted",()=>{started=true;show(null);$("controls").classList.remove("hidden");startGame()});
socket.on("playerState",p=>remote[p.id]=p);
socket.on("disconnect",()=>{if(started)alert("Disconnected from server")});
</script>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let W,H,car={x:0,z:0,a:0,v:0,hp:100,boost:100},keys={},running=false;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener("resize",resize);resize();
function road(x,z){return Math.sin(x*.018)*80+Math.cos(z*.014)*70}
function draw(){
 ctx.fillStyle="#6b8f4b";ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-car.a*.18);
 ctx.fillStyle="#8b7a58";ctx.fillRect(-W,road(car.x,car.z)*.05,W*2,220);
 for(let i=-10;i<11;i++){ctx.fillStyle=i%2?"#456638":"#587843";ctx.fillRect(i*100+((car.z*.15)%100),-300,55,600)}
 ctx.fillStyle="#333";ctx.fillRect(-22,-32,44,64);ctx.fillStyle="#e85d2a";ctx.fillRect(-17,-26,34,45);
 ctx.fillStyle="#fff";ctx.fillRect(-12,-20,24,8);
 ctx.restore();
 for(const id in remote){const p=remote[id],dx=p.x-car.x,dz=p.z-car.z; if(Math.abs(dx)<900&&Math.abs(dz)<700){let sx=W/2+dx*.5,sy=H/2+dz*.35;ctx.fillStyle="#35a7ff";ctx.fillRect(sx-12,sy-20,24,40)}}
}
function loop(){if(!running)return;let steer=(keys.l?-1:0)+(keys.r?1:0),th=(keys.go?1:0)+(keys.back?-1:0);
 if(keys.boost&&car.boost>0){th*=2.2;car.boost-=.8}else car.boost=Math.min(100,car.boost+.18);
 if(keys.hand)car.v*=.93; car.a+=steer*.045*(.7+Math.min(1,Math.abs(car.v)/8));car.v+=th*.18;car.v*=.985;car.x+=Math.sin(car.a)*car.v;car.z+=Math.cos(car.a)*car.v;
 if(keys.repair){car.hp=Math.min(100,car.hp+1);keys.repair=false}
 $("speed").textContent=Math.round(Math.abs(car.v)*12)+" km/h";$("boostbar").style.width=car.boost+"%";draw();
 socket.volatile.emit("state",{x:car.x,z:car.z,rot:car.a,speed:car.v});requestAnimationFrame(loop)}
function startGame(){running=true;loop()}
function bind(id,k){let b=$(id);const on=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off)}
bind("turnL","l");bind("turnR","r");bind("go","go");bind("back","back");bind("boost","boost");bind("hand","hand");bind("repair","repair");
addEventListener("keydown",e=>{keys[{ArrowLeft:"l",ArrowRight:"r",ArrowUp:"go",ArrowDown:"back",Shift:"boost", " ":"hand"}[e.key]]=true});
addEventListener("keyup",e=>{keys[{ArrowLeft:"l",ArrowRight:"r",ArrowUp:"go",ArrowDown:"back",Shift:"boost", " ":"hand"}[e.key]]=false});
</script>
</body></html>
